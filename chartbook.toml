[project]
name = "Foreign Exchange Returns"
description = "Daily FX returns for USD invested in foreign currencies via overnight repo markets"
contributors = [
    "Jeremy Bejarano",
    "Kunj Mehta",
]
repo_url = "https://github.com/ftsfr/foreign_exchange"
copyright = "2025"
os_compatibility = [
    "Windows/Linux/MacOS (requires Bloomberg)",
]

[notebooks.summary_fx_returns]
name = "summary_fx_returns"
description = "Summary statistics and visualization of FX returns"
path = "_output/summary_fx_returns.ipynb"
publishable = true

[dataframes.ftsfr_fx_returns]
name = "ftsfr_fx_returns"
description = "Daily FX returns for USD invested in 9 foreign currencies"
sources = [
    "Bloomberg FX",
]
providers = [
    "Bloomberg",
]
contact_required = [
    "no",
]
pre_approved = [
    "No",
]
provider_links = [
    "https://bloomberg.com",
]
tags = [
    "FX",
    "foreign exchange",
    "currency",
    "returns",
]
access_types = [
    "Bloomberg Terminal",
]
license = "Bloomberg"
restrictions = "No"
pull_method = "Pulled from Bloomberg via xbbg"
path = "./_data/ftsfr_fx_returns.parquet"
date_col = "ds"
docs = """
## Foreign Exchange Returns

Daily returns for USD invested in foreign currencies via overnight repo markets.

### Columns

| Column | Description |
|--------|-------------|
| unique_id | Currency identifier (e.g., EUR_return) |
| ds | Date |
| y | Daily annualized return (percent) |

### Methodology

$$
ret_{t,i} = (spot_{t-1,i} / spot_{t,i}) × fret_{t,i}
$$

Where:
- spot: Exchange rate (how much 1 USD is worth in foreign currency)
- fret: Foreign currency return in overnight repo market

### Currencies

AUD, CAD, CHF, EUR, GBP, JPY, NZD, SEK, USD

### Data Source

Bloomberg FX spot rates and OIS interest rates
"""

[charts.fx_cumulative_returns]
name = "Foreign Exchange Cumulative Returns"
description = "Cumulative returns showing growth of $1 invested in foreign currencies"
dataframe = "ftsfr_fx_returns"
path = "./_output/fx_cumulative_returns.html"
tags = [
    "FX",
    "foreign exchange",
    "currency",
    "cumulative returns",
]
docs = """
## Foreign Exchange Cumulative Returns

Cumulative returns showing growth of $1 invested in foreign currencies via overnight repo markets.

### Currencies

AUD, CAD, CHF, EUR, GBP, JPY, NZD, SEK, USD

### Calculation

Cumulative return = Product of (1 + daily return) over time

### Data Source

Bloomberg FX spot rates and OIS interest rates
"""
